<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Embedding</title>
    <link rel="stylesheet" href="styles.css">
</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Mystery+Quest&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Sour+Gummy:ital,wdth,wght@0,100..125,100..900;1,100..125,100..900&display=swap"
    rel="stylesheet">

<body>
    <div class="container">
        <header>
            <h1>This is a fancy title</h1>
        </header>
    </div>
    <main>
        <section>
            <!-- ai prompt for placeholder content:
             in the main, add a section with an h3 and two paragraphs about snow -->
            <h3>Snow</h3>
            <p>Snow is formed when water vapor freezes into ice crystals in cold clouds.</p>
            <p>It creates a bright white blanket across the landscape and can inspire outdoor winter activities.</p>
        </section>
        <section>
            <!-- embedding external sources like videos and map -->
            <iframe width="560" height="315" src="https://www.youtube.com/embed/qk6MeIXsUeU?si=YFagBvHpj14UzX3B"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5608.046295217805!2d-75.75948746511233!3d45.348344999999995!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cce07fde3c9a467%3A0xb368c3f179109015!2sAlgonquin%20College%20Building%20T%2C%20Woodroffe%20Avenue%2C%20Nepean%2C%20ON!5e0!3m2!1sen!2sca!4v1795542083208!5m2!1sen!2sca"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>
    </main>
</body>

</html>
